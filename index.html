<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘도 근무 중 이상 무!</title>
<style>
:root{--bg:#171313;--panel:#281e19;--paper:#ead9b8;--gold:#c99b45;--red:#7e2525;--green:#496b4c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle,#493a30,#171313 70%);color:#eadcbf;font-family:Georgia,"Noto Serif KR",serif}button{font:inherit;cursor:pointer}.app{padding:10px;min-height:100vh}.top{max-width:1500px;margin:auto;background:#241c18;border:2px solid #80663f;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 10px 30px #0008}.title{font-size:clamp(18px,2.5vw,30px);font-weight:bold}.sub{font-size:11px;color:#c8b897}.stats{display:flex;gap:12px;white-space:nowrap;font-weight:bold}.coin{color:#e9c45c}.danger{color:#df7d6d}.layout{max-width:1500px;margin:10px auto;display:grid;grid-template-columns:235px minmax(480px,1fr) 285px;gap:10px}.panel,.desk{border:2px solid #6d5537;box-shadow:0 10px 28px #0008}.panel{background:linear-gradient(#382a23,#241b17);padding:13px}.panel h2{font-size:16px;color:#e5c98d;border-bottom:1px solid #806b4c;padding-bottom:7px;margin:0 0 8px}.rule{font-size:12px;padding:7px 0;border-bottom:1px solid #514138;line-height:1.45}.wanted{margin-top:12px;background:#e9d7ae;color:#332820;padding:9px;border:3px solid #5c4530}.wanted .face{height:75px;background:#b59c73;display:grid;place-items:center;font-size:42px;margin:5px 0}.scene{height:480px;position:relative;overflow:hidden;background:linear-gradient(#58676b 0 54%,#3e3028 54%);border:2px solid #5c4934}.sky{position:absolute;inset:0 0 45%;background:linear-gradient(#29363b,#68716c)}.wall{position:absolute;left:0;right:0;bottom:43%;height:150px;background:repeating-linear-gradient(90deg,#625448 0 68px,#51443b 68px 72px),repeating-linear-gradient(0deg,transparent 0 36px,#342b27 36px 39px)}.gate{position:absolute;bottom:39%;left:50%;transform:translateX(-50%);width:45%;height:245px;border:22px solid #392b25;border-bottom:0;border-radius:160px 160px 0 0;background:repeating-linear-gradient(90deg,#171313 0 12px,#382720 12px 19px);box-shadow:inset 0 0 40px #000}.flag{position:absolute;top:35px;left:8%;font-size:40px}.visitor{position:absolute;bottom:38%;left:50%;transform:translateX(-50%);z-index:2;text-align:center}.portrait{font-size:105px;filter:drop-shadow(0 7px 5px #0008)}.speech{background:#efe0bd;color:#2b241d;border:3px solid #44352a;padding:7px 10px;min-width:220px;font-size:13px}.desk{background:linear-gradient(135deg,#775239,#493225);padding:12px}.documents{display:grid;grid-template-columns:1fr 1fr;gap:9px}.doc{background:var(--paper);color:#2b241d;min-height:160px;padding:10px;border:2px solid #745638;box-shadow:3px 5px 8px #0006}.doc h3{margin:0 0 7px;font-size:13px}.doc p{margin:4px 0;font-size:11px}.seal{float:right;width:36px;height:36px;border:3px double #832d2d;border-radius:50%;display:grid;place-items:center;color:#832d2d;font-size:9px;font-weight:bold}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tool,.decision{border:2px solid #392820;background:#261c18;color:#ead9b5;padding:9px 11px;box-shadow:2px 3px #0006}.tool.active{outline:2px solid var(--gold)}.decision{flex:1;min-width:120px;font-weight:bold}.pass{background:#3f6348}.deny{background:#6f3b36}.arrest{background:#632b2b}.visitor-card{background:#f5e8cc;color:#2b241d;padding:10px;border:3px solid #5d4933}.bigface{height:130px;background:#b49b73;display:grid;place-items:center;font-size:85px;border:2px solid #6d563d;margin-bottom:7px}.field{display:flex;justify-content:space-between;border-bottom:1px dashed #9a815d;padding:4px 0;font-size:11px}.field span:last-child{font-weight:bold}.status{margin-top:8px;padding:7px;background:#2d2520;color:#eeddbb;font-size:11px}.log{margin-top:10px;font-size:10px;max-height:125px;overflow:auto}.log div{padding:4px 0;border-bottom:1px solid #59463b}.note{text-align:center;font-size:10px;color:#c8b897;margin-top:6px}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:20px;z-index:20}.modal.show{display:grid}.modalbox{max-width:550px;width:100%;background:#f5e8cc;color:#2b241d;border:4px solid #5a4430;padding:18px}.modalbox button{width:100%;padding:11px;background:#33251d;color:white;border:2px solid #513a29}@media(max-width:1000px){.layout{grid-template-columns:1fr}.left,.right{display:none}}@media(max-width:600px){.app{padding:4px}.stats{font-size:11px;gap:5px}.scene{height:400px}.documents{grid-template-columns:1fr}.doc{min-height:135px}.decision{min-width:30%;padding:8px 4px;font-size:11px}}
</style></head><body><div class="app">
<header class="top"><div><div class="title">오늘도 근무 중 이상 무!</div><div class="sub">ALL CLEAR TODAY! · 카를스반 영지 성문 검문소</div></div><div class="stats"><span>제 <b id="day">1</b>일차</span><span id="clock">06:00</span><span class="coin">◉ <b id="money">30</b></span><span class="danger">실수 <b id="mistakes">0</b></span></div></header>
<main class="layout"><aside class="panel left"><h2>영주의 하사문</h2><div id="rules"></div><div class="wanted"><b>수배전단</b><div class="face">?</div><small id="wantedText"></small></div></aside>
<section><div class="scene"><div class="sky"></div><div class="wall"></div><div class="flag">⚑</div><div class="gate"></div><div class="visitor"><div id="portrait" class="portrait">🧑‍🌾</div><div id="speech" class="speech">통행증을 제출하겠습니다.</div></div></div>
<div class="desk"><div id="documents" class="documents"></div><div class="toolbar"><button class="tool" data-tool="seal">🔍 인장 감정</button><button class="tool" data-tool="cargo">🧳 소지품 수색</button><button class="tool" data-tool="ask">💬 재질문</button></div><div class="toolbar"><button class="decision pass" data-action="pass">🟢 성문 통과</button><button class="decision deny" data-action="deny">🟠 거부</button><button class="decision arrest" data-action="arrest">🔴 경비대 호출</button></div><div class="note">서류·외모·소지품을 모두 대조하십시오.</div></div></section>
<aside class="panel right"><h2>방문객 기록</h2><div class="visitor-card"><div id="bigface" class="bigface">🧑‍🌾</div><div class="field"><span>이름</span><span id="vname">-</span></div><div class="field"><span>출신지</span><span id="vfrom">-</span></div><div class="field"><span>직업</span><span id="vjob">-</span></div><div class="field"><span>방문 목적</span><span id="vpurpose">-</span></div><div class="field"><span>체류</span><span id="vstay">-</span></div><div class="status" id="vstatus">검사를 시작하십시오.</div></div><div class="log" id="log"></div></aside></main></div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="modalNext">확인</button></div></div>
<script>
const DAYS=[["통행증 유효기간 확인","영지 인장 확인","발급 도시와 방문객 정보 대조"],["통행증 기본 규칙","수배전단의 점·흉터·키 대조","수배자는 즉시 경비대 호출"],["신체 검사서 확인","열병/기침 증상 관찰","의심 환자는 거부"],["교단 징표 확인","성수 반응 검사 가능","마물 의심자는 경비대 호출"],["마법사 등록증 확인","용병 무기 반납 여부","특수 직군 서류 대조"]];
const V=[
["마르코 벨","하르덴","농부","곡물 거래","1일","🧑‍🌾",1,1,"밀자루","정상 방문객","곡물 시장에 갑니다.","오늘 장이 열리는 날이라서요."],
["엘리나 로슈","벨로아","상인","염료 판매","3일","👩‍🦰",1,0,"염료 상자","인장 위조","염료를 팔러 왔습니다.","상자에는 붉은 염료뿐입니다."],
["도란","카를스반","대장장이","납품","1일","🧔",0,1,"철괴","기간 만료","대장간에 철을 납품합니다.","어제 발급받은 통행증입니다."],
["세르 라인","노르드","용병","호위","7일","🧝",1,1,"검 1자루","정상 용병","상단을 호위합니다.","무기는 경비대에 맡기겠습니다."],
["???","서부 황야","여행자","친척 방문","2일","🧟",1,1,"빈 자루","마물 위장","나는... 사람입니다.","성 안에는 무엇이 있습니까?"],
["페르나","아르델","사제","성당 방문","2일","🧕",1,1,"성서","정상 사제","기도를 드리러 왔습니다.","교단의 축복을 받았습니다."],
["카인","벨로아","상인","귀족 접견","1일","🧑‍💼",1,1,"봉인된 상자","밀수품","영주님께 선물을 전합니다.","열어보실 필요는 없습니다."],
["루드","하르덴","농부","가족 방문","1일","👨‍🌾",1,1,"채소","정상 방문객","가족을 만나러 왔습니다.","아내가 안에서 기다립니다."]
];
let s={day:1,money:30,mistakes:0,done:0,idx:0,v:null};
const $=x=>document.getElementById(x);
function rules(){const a=DAYS[Math.min(s.day-1,4)];$("day").textContent=s.day;$("rules").innerHTML=a.map((x,i)=>"<div class='rule'><b>"+(i+1)+".</b> "+x+"</div>").join("");$("wantedText").textContent=s.day>=2?"수배자: 왼쪽 눈썹 위 긴 흉터 · 키 178cm":"1일차에는 수배자가 없습니다."}
function next(){if(s.done>=8){end();return} s.v=V[(s.idx+s.day-1)%V.length];s.idx++;render()}
function render(){const v=s.v;$("portrait").textContent=v[5];$("bigface").textContent=v[5];$("vname").textContent=v[0];$("vfrom").textContent=v[1];$("vjob").textContent=v[2];$("vpurpose").textContent=v[3];$("vstay").textContent=v[4];$("speech").textContent=v[11];$("vstatus").textContent="서류와 실제 인물을 대조하십시오.";let valid=s.day===1?v[6]:1;$("documents").innerHTML="<div class='doc'><div class='seal'>"+(v[7]?"정품":"위조")+"</div><h3>통행 허가증</h3><p><b>성명:</b> "+v[0]+"</p><p><b>발급:</b> "+v[1]+"</p><p><b>직업:</b> "+v[2]+"</p><p><b>목적:</b> "+v[3]+"</p><p><b>유효:</b> "+(valid?"유효":"만료")+"</p></div><div class='doc'><h3>신분·물품 신고서</h3><p><b>체류:</b> "+v[4]+"</p><p><b>신고품:</b> "+v[8]+"</p><p><b>진술:</b> "+v[10]+"</p><p style='margin-top:12px'>방문객의 말과 문서를 비교하십시오.</p></div>"}
function log(t){const d=document.createElement("div");d.textContent=t;$("log").prepend(d)}
document.querySelectorAll(".tool").forEach(b=>b.onclick=function(){document.querySelectorAll(".tool").forEach(x=>x.classList.remove("active"));b.classList.add("active");const v=s.v;if(b.dataset.tool==="seal")toast(v[7]?"인장 문양이 정품과 일치합니다.":"인장이 미세하게 어긋납니다. 위조 흔적입니다.");if(b.dataset.tool==="cargo")toast(v[9]==="밀수품"?"봉인 아래에서 금지품이 감지됩니다.":"특별한 밀수품은 발견되지 않았습니다.");if(b.dataset.tool==="ask")toast("방문객: "+v[10])});
document.querySelectorAll(".decision").forEach(b=>b.onclick=function(){judge(b.dataset.action)});
function judge(a){const v=s.v;let c;if(v[9]==="마물 위장"||v[9]==="밀수품")c=a==="arrest";else if(v[9]==="인장 위조"||v[9]==="기간 만료")c=a==="deny";else c=a==="pass";if(c){s.money+=5;toast("정확한 판정! +5 동전");$("vstatus").textContent="판정 완료 — 이상 무.";log("정확: "+v[0]+" · "+a)}else{s.mistakes++;if(s.mistakes>=2)s.money-=10;toast(s.mistakes>=2?"오판! -10 동전":"오판! 1회 경고");$("vstatus").textContent="판정 오류 — 기록됨.";log("오판: "+v[0]+" · "+a)}$("money").textContent=s.money;$("mistakes").textContent=s.mistakes;s.done++;setTimeout(next,650)}
function toast(t){const d=document.createElement("div");d.textContent=t;d.style="position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#201814;color:#f4e4c2;border:2px solid #9b7746;padding:11px 18px;z-index:30";document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
function end(){$("modalTitle").textContent="근무 종료";$("modalText").textContent="오늘의 심사가 끝났습니다. 처리 8건 · 보유 동전 "+s.money+"개. 다음 날 새로운 규칙이 추가됩니다."; $("modal").classList.add("show");$("modalNext").onclick=function(){$("modal").classList.remove("show");s.day++;s.done=0;s.idx=0;s.mistakes=0;s.money=Math.max(0,s.money-15);rules();next()}}
rules();next();
</script></body></html>
