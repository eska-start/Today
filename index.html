<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘도 근무 중 이상 무!</title>
<style>
:root{--bg:#171313;--panel:#281e19;--paper:#ead9b8;--gold:#c99b45;--red:#7e2525;--green:#496b4c;--ink:#2b241d;--muted:#bfae91}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle,#493a30,#171313 70%);color:#eadcbf;font-family:Georgia,"Noto Serif KR",serif}
button{font:inherit;cursor:pointer}
.app{padding:10px;min-height:100vh}
.top{max-width:1500px;margin:auto;background:#241c18;border:2px solid #80663f;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 10px 30px #0008}
.title{font-size:clamp(18px,2.5vw,30px);font-weight:bold}.sub{font-size:11px;color:#c8b897}
.stats{display:flex;gap:12px;white-space:nowrap;font-weight:bold}.coin{color:#e9c45c}.danger{color:#df7d6d}
.layout{max-width:1500px;margin:10px auto;display:grid;grid-template-columns:245px minmax(500px,1fr) 320px;gap:10px}
.panel,.desk{border:2px solid #6d5537;box-shadow:0 10px 28px #0008}
.panel{background:linear-gradient(#382a23,#241b17);padding:13px}.panel h2{font-size:16px;color:#e5c98d;border-bottom:1px solid #806b4c;padding-bottom:7px;margin:0 0 8px}
.rule{font-size:12px;padding:7px 0;border-bottom:1px solid #514138;line-height:1.45}.rule.lock{opacity:.45}
.wanted{margin-top:12px;background:#e9d7ae;color:#332820;padding:9px;border:3px solid #5c4530}
.wanted .wanted-head{display:flex;justify-content:space-between;align-items:center}.wanted .wanted-face{height:70px;background:#b59c73;display:grid;place-items:center;font-size:40px;margin:5px 0}
.wanted small{display:block;line-height:1.45}.tag{display:inline-block;padding:2px 6px;margin:2px;border:1px solid #8f774e;background:#f0dfbd;font-size:10px}
.scene{height:500px;position:relative;overflow:hidden;background:linear-gradient(#58676b 0 54%,#3e3028 54%);border:2px solid #5c4934}
.sky{position:absolute;inset:0 0 45%;background:linear-gradient(#29363b,#68716c)}
.wall{position:absolute;left:0;right:0;bottom:43%;height:150px;background:repeating-linear-gradient(90deg,#625448 0 68px,#51443b 68px 72px),repeating-linear-gradient(0deg,transparent 0 36px,#342b27 36px 39px)}
.gate{position:absolute;bottom:39%;left:50%;transform:translateX(-50%);width:45%;height:245px;border:22px solid #392b25;border-bottom:0;border-radius:160px 160px 0 0;background:repeating-linear-gradient(90deg,#171313 0 12px,#382720 12px 19px);box-shadow:inset 0 0 40px #000}
.flag{position:absolute;top:35px;left:8%;font-size:40px}
.visitor{position:absolute;bottom:36%;left:50%;transform:translateX(-50%);z-index:2;text-align:center;min-width:270px}
.portrait{font-size:100px;filter:drop-shadow(0 7px 5px #0008)}.speech{background:#efe0bd;color:#2b241d;border:3px solid #44352a;padding:7px 10px;min-width:240px;font-size:13px;box-shadow:0 4px 10px #0005}
.traits{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px;max-width:44%}.trait{background:#201814dd;border:1px solid #8a6a40;color:#ead9b5;padding:4px 6px;font-size:10px}
.casebar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:7px 0 0;font-size:11px}.caseid{color:#dcc08a}.used{color:#b8aa92}
.desk{background:linear-gradient(135deg,#775239,#493225);padding:12px}
.documents{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.doc{background:var(--paper);color:#2b241d;min-height:205px;padding:10px;border:2px solid #745638;box-shadow:3px 5px 8px #0006;position:relative}
.doc h3{margin:0 0 7px;font-size:13px}.doc p{margin:4px 0;font-size:11px}.sealstamp{position:absolute;right:8px;top:8px;width:76px;height:76px;transform:rotate(-7deg)}.sealstamp svg{width:100%;height:100%;display:block}.bookbtn{width:100%;margin-top:9px;padding:9px;background:#4a3626;color:#ead9b5;border:2px solid #80613b;box-shadow:2px 3px #0005;font-weight:bold}.book-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.seal-card{background:#ead9b8;border:2px solid #765a39;padding:7px;color:#30261f;text-align:center;cursor:pointer}.seal-card.active{outline:3px solid #b0823c}.seal-card strong{display:block;font-size:11px;margin-top:4px}.seal-card small{display:block;font-size:9px;line-height:1.35;margin-top:3px}.seal-ref{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;background:#e7d3a9;border:2px solid #765a39;padding:10px;margin:8px 0}.seal-ref .bigseal{width:105px;height:105px}.seal-ref h3{margin:0 0 5px;font-size:15px}.seal-ref p{margin:3px 0;font-size:11px}.comparebar{display:flex;gap:8px;margin-top:10px}.comparebar button{flex:1;padding:10px;border:2px solid #5b422c;background:#33251d;color:#fff}.compare-result{padding:8px;margin-top:8px;background:#efe0bd;border:2px solid #765a39;color:#30261f;font-size:11px;line-height:1.45}
.doc .line{border-top:1px solid #ad946e;margin:7px 0}.doc .hint{font-size:10px;color:#665039}.blur{filter:blur(1.2px)}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.tool,.decision{border:2px solid #392820;background:#261c18;color:#ead9b5;padding:9px 11px;box-shadow:2px 3px #0006}.tool.active{outline:2px solid var(--gold)}.tool.locked{opacity:.45;cursor:not-allowed}
.decision{flex:1;min-width:120px;font-weight:bold}.pass{background:#3f6348}.deny{background:#6f3b36}.arrest{background:#632b2b}
.visitor-card{background:#f5e8cc;color:#2b241d;padding:10px;border:3px solid #5d4933}
.bigface{height:115px;background:#b49b73;display:grid;place-items:center;font-size:80px;border:2px solid #6d563d;margin-bottom:7px}
.field{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #9a815d;padding:4px 0;font-size:11px}.field span:last-child{font-weight:bold;text-align:right}
.status{margin-top:8px;padding:7px;background:#2d2520;color:#eeddbb;font-size:11px;line-height:1.45}
.evidence{margin-top:9px;background:#efe0bd;color:#312820;border:2px solid #765a39;padding:8px}.evidence h3{font-size:12px;margin:0 0 6px}.evidence-row{font-size:10px;padding:4px 0;border-bottom:1px solid #c4ab81}.evidence-row:last-child{border-bottom:0}
.log{margin-top:10px;font-size:10px;max-height:125px;overflow:auto}.log div{padding:4px 0;border-bottom:1px solid #59463b}
.note{text-align:center;font-size:10px;color:#c8b897;margin-top:6px}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px;z-index:20}.modal.show{display:grid}
.modalbox{max-width:620px;width:100%;background:#f5e8cc;color:#2b241d;border:4px solid #5a4430;padding:18px}.modalbox button{width:100%;padding:11px;background:#33251d;color:white;border:2px solid #513a29}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.summary-item{border:1px solid #9a815d;padding:7px;background:#ead7af;font-size:11px}
@media(max-width:1100px){.layout{grid-template-columns:1fr 320px}.left{display:none}}
@media(max-width:800px){.layout{grid-template-columns:1fr}.right{display:none}.scene{height:410px}}
@media(max-width:600px){
  html,body{width:100%;height:100%;overflow:hidden}
  body{font-size:12px}
  .app{width:100%;height:100dvh;min-height:0;padding:3px;overflow:hidden}
  .top{height:52px;padding:5px 8px;gap:6px;border-width:1px}
  .title{font-size:16px;white-space:nowrap}
  .sub{font-size:8px;white-space:nowrap}
  .stats{font-size:9px;gap:4px}
  .layout{height:calc(100dvh - 58px);min-height:0;margin:3px auto;display:block;overflow:hidden}
  .left,.right{display:none}
  section{height:100%;min-height:0;display:flex;flex-direction:column}
  .scene{height:31dvh;min-height:190px;max-height:300px;flex:0 0 31dvh;border-width:1px}
  .sky{bottom:45%}
  .wall{height:85px}
  .gate{width:42%;height:145px;border-width:12px}
  .flag{top:15px;left:5%;font-size:27px}
  .visitor{bottom:29%;min-width:0;width:60%}
  .portrait{font-size:62px}
  .speech{min-width:0;width:100%;font-size:10px;padding:5px 7px;border-width:2px}
  .traits{left:5px;bottom:5px;max-width:68%;gap:2px}
  .trait{font-size:8px;padding:2px 4px}
  .casebar{height:22px;margin:2px 0;font-size:9px;flex:0 0 22px}
  .desk{min-height:0;flex:1;padding:5px;border-width:1px;overflow:hidden}
  .documents{height:calc(100% - 92px);min-height:120px;grid-template-columns:1fr 1fr;gap:4px}
  .doc{min-height:0;height:100%;padding:6px;border-width:1px;overflow:hidden}
  .doc h3{margin:0 0 3px;font-size:10px}
  .doc p{margin:2px 0;font-size:8px;line-height:1.25}
  .doc .line{margin:4px 0}
  .doc .hint{font-size:7px}
  .sealstamp{width:42px;height:42px;right:4px;top:4px}
  .toolbar{height:34px;min-height:34px;gap:3px;margin-top:3px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden}
  .tool,.decision{padding:5px 4px;font-size:8px;border-width:1px;box-shadow:1px 2px #0006;white-space:nowrap}
  .tool{flex:0 0 auto}
  .decision{min-width:0;flex:1}
  .note{font-size:7px;margin-top:2px;line-height:1.1}
  .modal{padding:8px}
  .modalbox{max-height:92dvh;overflow:auto;padding:10px;border-width:2px}
  .modalbox h2{font-size:16px;margin:3px 0 7px}
  .modalbox p{font-size:10px}
  .book-grid{grid-template-columns:repeat(4,1fr);gap:3px}
  .seal-card{padding:3px;border-width:1px}
  .seal-card strong{font-size:8px}
  .seal-card small{display:none}
  .seal-ref{grid-template-columns:65px 1fr;gap:6px;padding:5px;margin:5px 0}
  .seal-ref .bigseal{width:62px;height:62px}
  .seal-ref h3{font-size:10px}
  .seal-ref p{font-size:8px;margin:2px 0}
  .comparebar{gap:4px;margin-top:5px}
  .comparebar button,.modalbox button{padding:7px;font-size:9px}
  .summary-grid{gap:3px;margin:5px 0}
  .summary-item{padding:4px;font-size:8px}
}
